name: bootstrap
description: Assets used while fitting this framework to a target repo. These usually should not remain installed in the target repo.
install_policy: >-
  These entries are installer inputs only and do not authorize copying them
  into a target repo. Install a source only when a current-change or optional
  manifest separately selects it.
assets:
  - id: principles-doc
    asset_type: bootstrap
    source: docs/principles.md
    use_when: Understanding the framework principles before fitting a harness.
  - id: staged-installer
    asset_type: bootstrap
    source: docs/installer.md
    use_when: Starting the default one-Profile-Change installation workflow.
  - id: bounded-work-installer-checklist
    asset_type: bootstrap
    source: docs/install/bounded-work.md
    use_when: Adding, removing, or changing the Bounded Work realization.
  - id: focused-context-installer-checklist
    asset_type: bootstrap
    source: docs/install/focused-context.md
    use_when: Adding, removing, or changing the Focused Context realization.
  - id: agent-action-boundaries-installer-checklist
    asset_type: bootstrap
    source: docs/install/agent-action-boundaries.md
    use_when: Adding, removing, or changing selected Agent Action Boundaries.
  - id: maintainability-feedback-installer-checklist
    asset_type: bootstrap
    source: docs/install/maintainability-feedback.md
    use_when: Adding, removing, or changing selected Maintainability Feedback.
  - id: capability-map
    asset_type: bootstrap
    source: docs/capability-map.md
    use_when: Resolving capability outcomes and prerequisite closure for the current Profile Change.
  - id: portable-assets
    asset_type: bootstrap
    source: docs/portable-assets.md
    use_when: Distinguishing bootstrap, installable, optional, and adapter assets.
  - id: platform-support
    asset_type: bootstrap
    source: docs/platform-support.md
    use_when: Adding platform-specific support such as hooks, settings, skill adapters, or cross-tool behavior.
  - id: codex-platform-support
    asset_type: bootstrap
    source: docs/platforms/codex.md
    use_when: Adding Codex-specific hooks, config, or skill loading support.
  - id: claude-code-platform-support
    asset_type: bootstrap
    source: docs/platforms/claude-code.md
    use_when: Adding Claude Code-specific hooks, settings, native skills, or instruction loading support.
  - id: claude-skill-sync-script
    asset_type: bootstrap
    source: scripts/sync_claude_skills.py
    use_when: Installing generated Claude Code skill mirrors from explicitly marked canonical .agents/skills sources.
  - id: bounded-work-manifest
    asset_type: bootstrap
    source: manifests/bounded-work.yml
    use_when: Selecting the Bounded Work foundation assets and behaviors.
  - id: focused-context-manifest
    asset_type: bootstrap
    source: manifests/focused-context.yml
    use_when: Selecting Focused Context assets and behaviors.
  - id: agent-action-boundaries-manifest
    asset_type: bootstrap
    source: manifests/agent-action-boundaries.yml
    use_when: Selecting exact Agent Action Boundary families and their protocol.
  - id: maintainability-feedback-manifest
    asset_type: bootstrap
    source: manifests/maintainability-feedback.yml
    use_when: Selecting exact Maintainability Feedback sensor families and their protocol.
  - id: optional-assets-manifest
    asset_type: bootstrap
    source: manifests/optional-assets.yml
    use_when: Selecting optional pull-ins justified by repo evidence.

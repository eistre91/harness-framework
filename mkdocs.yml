site_name: Agent Harness Learning
site_description: A practical learning path for working with LLMs and agents.
site_url: https://eistre91.github.io/harness-framework/

docs_dir: docs/learn
site_dir: site
use_directory_urls: true

nav:
  - Home: index.md
  - Foundations: 01-foundations.md
  - The Mental Model: 02-mental-model.md
  - Prompt Engineering: 03-prompt-engineering.md

draft_docs: |
  04-context-engineering.md
  notes.md
  where-are-we-going.md

theme:
  name: material
  font: false
  features:
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use light mode

copyright: A practical learning path for working with LLMs and agents.

extra:
  generator: false

extra_css:
  - assets/styles.css

name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-checks:
    name: Canonical checks (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.28"
          python-version: "3.14"

      - name: Install locked development environment
        run: uv sync --locked

      - name: Record resolved dependency versions
        run: uv tree --locked

      - name: Run canonical checks
        run: ./scripts/repo-checks.sh
